<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RK3568 项目全链路阅读器</title>
  <style>
    :root {
      --bg: #edf1f2;
      --surface: #ffffff;
      --surface-2: #f5f7f7;
      --text: #172126;
      --muted: #5c686e;
      --line: #d5dcde;
      --line-strong: #aeb9bd;
      --green: #176b54;
      --green-soft: #e1f0ea;
      --blue: #2a6484;
      --blue-soft: #e3eef4;
      --amber: #9a6615;
      --amber-soft: #f7edd9;
      --red: #9a3f38;
      --red-soft: #f6e6e3;
      --purple: #66518c;
      --purple-soft: #eee9f5;
      --sidebar: 284px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { min-width: 320px; }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; min-width: 0; background: #f9faf9; border-right: 1px solid var(--line); }
    .brand { padding: 18px 16px 14px; border-bottom: 1px solid var(--line); }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.4; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .search-wrap { padding: 12px; border-bottom: 1px solid var(--line); }
    .search { width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); outline: none; }
    .search:focus { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber-soft); }
    .nav { flex: 1; overflow: auto; padding: 8px; }
    .nav button { width: 100%; min-height: 42px; margin: 2px 0; padding: 9px 10px; border: 0; border-left: 3px solid transparent; border-radius: 4px; background: transparent; text-align: left; cursor: pointer; }
    .nav button:hover { background: #edf1ef; }
    .nav button.active { border-left-color: var(--green); background: var(--green-soft); color: #124f40; font-weight: 700; }
    .side-note { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.6; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 68px; padding: 10px 22px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
    .topbar h2 { margin: 0; font-size: 17px; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .status-key { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border: 1px solid; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .verified { color: var(--green); background: var(--green-soft); border-color: #add3c3; }
    .source { color: var(--blue); background: var(--blue-soft); border-color: #b6d2df; }
    .pending { color: var(--amber); background: var(--amber-soft); border-color: #dfc895; }
    .missing { color: var(--red); background: var(--red-soft); border-color: #ddb5b0; }
    .content { width: min(1320px, 100%); margin: 0 auto; padding: 22px; }
    .view { display: none; }
    .view.active { display: block; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
    .section-head h3 { margin: 0; font-size: 21px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .band { margin-bottom: 18px; padding: 17px 18px; border: 1px solid var(--line); border-left: 4px solid var(--green); background: var(--surface); }
    .band h4 { margin: 0 0 8px; font-size: 15px; }
    .band p { margin: 0; line-height: 1.8; }
    .architecture { display: grid; gap: 8px; margin-bottom: 18px; }
    .layer { display: grid; grid-template-columns: 135px minmax(0, 1fr); min-height: 74px; border: 1px solid var(--line); background: var(--surface); }
    .layer-label { display: grid; place-items: center; padding: 10px; border-right: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 13px; text-align: center; }
    .nodes { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 11px; }
    .node { min-height: 36px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; font-size: 12px; line-height: 1.45; }
    .node.kernel { border-color: #94b9ce; background: var(--blue-soft); }
    .node.user { border-color: #9cc8b6; background: var(--green-soft); }
    .node.data { border-color: #cfb56e; background: var(--amber-soft); }
    .node.ui { border-color: #b7a7cf; background: var(--purple-soft); }
    .arrow { color: var(--muted); font-weight: 700; }
    .chain-strip { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 8px; margin: 16px 0 20px; }
    .chain-step { position: relative; min-height: 82px; padding: 12px 10px; border: 1px solid var(--line); border-top: 4px solid var(--blue); background: var(--surface); font-size: 12px; line-height: 1.55; }
    .chain-step strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .module-card { display: flex; flex-direction: column; min-height: 260px; padding: 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
    .module-card:hover { border-color: var(--line-strong); box-shadow: 0 3px 12px rgba(23,33,38,.07); }
    .module-card h4 { margin: 8px 0 7px; font-size: 16px; }
    .module-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .module-card .meta { margin-top: auto; padding-top: 12px; color: var(--text); font-size: 11px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 700; }
    .detail { margin-top: 16px; border: 1px solid var(--line); background: var(--surface); }
    .detail-head { display: flex; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .detail-head h4 { margin: 0; font-size: 18px; }
    .detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .detail-block { min-width: 0; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .detail-block:nth-child(odd) { border-right: 1px solid var(--line); }
    .detail-block h5 { margin: 0 0 8px; font-size: 13px; }
    .detail-block ul { margin: 0; padding-left: 19px; }
    .detail-block li { margin: 5px 0; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
    code { padding: 1px 4px; border-radius: 3px; background: #edf0f1; font-family: Consolas, monospace; font-size: .92em; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 12px; }
    th, td { padding: 10px 11px; border: 1px solid var(--line); text-align: left; vertical-align: top; line-height: 1.55; overflow-wrap: anywhere; }
    th { position: sticky; top: 68px; z-index: 2; background: #eef2f2; font-weight: 700; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); }
    .table-wrap table { border: 0; }
    .table-wrap th:first-child, .table-wrap td:first-child { border-left: 0; }
    .table-wrap th:last-child, .table-wrap td:last-child { border-right: 0; }
    .scenario-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .scenario-tabs button { min-height: 36px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; }
    .scenario-tabs button.active { color: #fff; border-color: var(--green); background: var(--green); }
    .diagram-shell { border: 1px solid var(--line); background: var(--surface); }
    .diagram-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
    .diagram-toolbar select { min-height: 36px; max-width: 280px; padding: 6px 30px 6px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); }
    .tool-group { display: inline-flex; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
    .tool-group button, .diagram-toolbar > button { min-width: 36px; min-height: 34px; padding: 6px 9px; border: 0; border-right: 1px solid var(--line); background: var(--surface); cursor: pointer; }
    .tool-group button:last-child { border-right: 0; }
    .tool-group button.active, .diagram-toolbar > button.active { color: #fff; background: var(--green); }
    .tool-group button:disabled { color: #9aa3a7; cursor: default; background: #eef1f1; }
    .toolbar-spacer { flex: 1; }
    .diagram-stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 600px; }
    .diagram-stage.expanded { grid-template-columns: minmax(0, 1fr); }
    .diagram-stage.expanded .diagram-inspector { display: none; }
    .diagram-viewport { position: relative; min-width: 0; height: 650px; overflow: hidden; background-color: #f8faf9; background-image: linear-gradient(#e8eded 1px, transparent 1px), linear-gradient(90deg, #e8eded 1px, transparent 1px); background-size: 24px 24px; touch-action: none; cursor: grab; }
    .diagram-viewport.dragging { cursor: grabbing; }
    .diagram-svg { display: block; width: 100%; height: 100%; user-select: none; }
    .diagram-node { cursor: pointer; }
    .diagram-node rect { fill: #fff; stroke: #809095; stroke-width: 1.5; rx: 5; vector-effect: non-scaling-stroke; }
    .diagram-node.kernel rect { fill: var(--blue-soft); stroke: #5e91ad; }
    .diagram-node.user rect { fill: var(--green-soft); stroke: #659f88; }
    .diagram-node.data rect { fill: var(--amber-soft); stroke: #b38b3d; }
    .diagram-node.ui rect { fill: var(--purple-soft); stroke: #8f7aaf; }
    .diagram-node.hardware rect { fill: #f3f4f4; stroke: #7f8b8f; }
    .diagram-node.output rect { fill: var(--red-soft); stroke: #b76760; }
    .diagram-node text { fill: var(--text); text-anchor: middle; pointer-events: none; }
    .diagram-node .node-title { font-size: 13px; font-weight: 700; }
    .diagram-node .node-sub { fill: #526168; font-size: 10px; }
    .diagram-edge { cursor: pointer; }
    .diagram-edge .edge-line { fill: none; stroke: #738388; stroke-width: 1.8; marker-end: url(#arrow-main); vector-effect: non-scaling-stroke; }
    .diagram-edge.hardware .edge-line { stroke: var(--red); marker-end: url(#arrow-red); }
    .diagram-edge.media .edge-line { stroke: var(--blue); marker-end: url(#arrow-blue); }
    .diagram-edge.data .edge-line { stroke: var(--green); marker-end: url(#arrow-green); }
    .diagram-edge.async .edge-line { stroke-dasharray: 7 5; }
    .diagram-edge .edge-hit { fill: none; stroke: transparent; stroke-width: 16; vector-effect: non-scaling-stroke; }
    .diagram-edge .edge-label-bg { fill: #fff; stroke: #bfc9cc; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .diagram-edge .edge-label { fill: #26363c; font-size: 11px; font-weight: 600; text-anchor: middle; pointer-events: none; }
    .diagram-edge:hover .edge-label-bg, .diagram-edge.selected .edge-label-bg { fill: #fff7e7; stroke: #c08016; stroke-width: 2; }
    .diagram-node.dimmed, .diagram-edge.dimmed { opacity: .13; }
    .diagram-edge.filtered { display: none; }
    .diagram-node.related rect, .diagram-node.selected rect { stroke: #c08016; stroke-width: 3; }
    .diagram-edge.related .edge-line, .diagram-edge.selected .edge-line { stroke: #c08016; stroke-width: 3.5; marker-end: url(#arrow-focus); }
    .diagram-node.trace-done rect { stroke: var(--green); stroke-width: 2.5; }
    .diagram-edge.trace-done .edge-line { stroke: var(--green); stroke-width: 3; marker-end: url(#arrow-green); }
    .diagram-node.search-hit rect { stroke: #c08016; stroke-width: 4; }
    .sequence-actor rect { fill: #fff; stroke: #76878c; stroke-width: 1.5; rx: 5; vector-effect: non-scaling-stroke; }
    .sequence-actor text { fill: var(--text); font-size: 12px; font-weight: 700; text-anchor: middle; }
    .sequence-life { stroke: #aeb9bd; stroke-width: 1.2; stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; }
    .sequence-message { cursor: pointer; }
    .sequence-message line, .sequence-message path { fill: none; stroke: #476873; stroke-width: 1.8; marker-end: url(#arrow-main); vector-effect: non-scaling-stroke; }
    .sequence-message.async line, .sequence-message.async path { stroke-dasharray: 7 5; }
    .sequence-message text { fill: #26363c; font-size: 11px; text-anchor: middle; pointer-events: none; }
    .sequence-message .sequence-label-bg { fill: #fff; stroke: #c9d1d3; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .sequence-message:hover .sequence-label-bg, .sequence-message.selected .sequence-label-bg { fill: #fff7e7; stroke: #c08016; stroke-width: 2; }
    .sequence-message .step-circle { fill: var(--green); stroke: none; }
    .sequence-message .step-number { fill: #fff; font-size: 9px; font-weight: 700; }
    .sequence-message.dimmed { opacity: .14; }
    .sequence-message.selected line, .sequence-message.selected path, .sequence-message.trace-done line, .sequence-message.trace-done path { stroke: #c08016; stroke-width: 3.2; marker-end: url(#arrow-focus); }
    .diagram-inspector { min-width: 0; padding: 16px; border-left: 1px solid var(--line); background: #fff; overflow: auto; }
    .diagram-inspector h4 { margin: 0 0 6px; font-size: 16px; }
    .diagram-inspector h5 { margin: 15px 0 6px; font-size: 12px; }
    .diagram-inspector p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .inspector-list { display: grid; gap: 7px; margin-top: 10px; }
    .inspector-row { padding: 8px 9px; border-left: 3px solid var(--line-strong); background: var(--surface-2); font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
    .inspector-row strong { display: block; margin-bottom: 2px; color: var(--text); }
    .diagram-caption { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .diagram-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .legend-line { display: inline-block; width: 28px; margin-right: 5px; border-top: 2px solid #738388; vertical-align: middle; }
    .legend-line.async { border-top-style: dashed; }
    .legend-line.alarm { border-color: var(--red); }
    .legend-line.media { border-color: var(--blue); }
    .legend-line.data { border-color: var(--green); }
    .timeline { counter-reset: step; border-left: 2px solid #a9c6ba; margin-left: 16px; padding-left: 24px; }
    .timeline-item { position: relative; margin-bottom: 11px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); }
    .timeline-item::before { counter-increment: step; content: counter(step); position: absolute; left: -38px; top: 11px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; background: var(--green); font-size: 11px; font-weight: 700; }
    .timeline-item strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .timeline-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .call-chain { margin-top: 16px; padding: 14px; border: 1px solid var(--line); background: #182328; color: #ecf3f1; font: 12px/1.8 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .evidence-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .evidence-row { padding: 14px; border: 1px solid var(--line); background: var(--surface); }
    .evidence-row h4 { margin: 0 0 7px; font-size: 14px; }
    .evidence-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .review-block { padding: 16px; border: 1px solid var(--line); background: var(--surface); }
    .review-block h4 { margin: 0 0 10px; }
    .review-block ol, .review-block ul { margin: 0; padding-left: 20px; }
    .review-block li { margin: 7px 0; line-height: 1.55; font-size: 12px; }
    .empty { padding: 30px; border: 1px dashed var(--line-strong); color: var(--muted); background: var(--surface); text-align: center; }
    .mobile-nav { display: none; width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chain-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: static; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 13px 14px; }
      .search-wrap, .nav, .side-note { display: none; }
      .topbar { position: static; display: block; padding: 10px 13px; }
      .status-key { justify-content: flex-start; margin-top: 9px; }
      .mobile-nav { display: block; margin-top: 10px; }
      .content { padding: 14px; }
      .grid, .evidence-grid, .review-grid, .detail-body { grid-template-columns: 1fr; }
      .detail-block:nth-child(odd) { border-right: 0; }
      .layer { grid-template-columns: 1fr; }
      .layer-label { border-right: 0; border-bottom: 1px solid var(--line); }
      .chain-strip { grid-template-columns: 1fr; }
      .diagram-stage { grid-template-columns: 1fr; }
      .diagram-stage.expanded { grid-template-columns: 1fr; }
      .diagram-viewport { height: 520px; }
      .diagram-inspector { border-left: 0; border-top: 1px solid var(--line); }
      .diagram-toolbar select { max-width: 100%; flex: 1 1 180px; }
      .toolbar-spacer { display: none; }
      th { position: static; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>RK3568 全链路阅读器</h1>
        <p>源码、接口、时序、联动与证据边界</p>
      </div>
      <div class="search-wrap">
        <input id="search" class="search" type="search" placeholder="搜索文件、函数、接口或模块">
      </div>
      <nav id="nav" class="nav" aria-label="主导航"></nav>
      <div class="side-note">事实基线：2026-08-29 当前项目源码<br>最终 HMI：顶层 userspace/hmi_qml</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="view-title">项目总览</h2>
          <p id="view-subtitle">从硬件触发一直追到本地告警、SQLite、MQTT 与 QML</p>
          <select id="mobile-nav" class="mobile-nav" aria-label="移动端主导航"></select>
        </div>
        <div class="status-key" aria-label="证据等级">
          <span class="badge verified">已验证</span>
          <span class="badge source">源码可证</span>
          <span class="badge pending">待复验</span>
          <span class="badge missing">未实现</span>
        </div>
      </header>

      <div class="content">
        <section id="overview" class="view active"></section>
        <section id="diagrams" class="view"></section>
        <section id="modules" class="view"></section>
        <section id="interfaces" class="view"></section>
        <section id="sequences" class="view"></section>
        <section id="evidence" class="view"></section>
        <section id="review" class="view"></section>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const views = [
      ["overview", "项目总览", "六层架构和三条主线"],
      ["diagrams", "全链路图", "点节点看上下游，点连线看接口，切时序看执行先后"],
      ["modules", "模块与源码", "按职责查看文件、函数和边界"],
      ["interfaces", "接口地图", "跨内核、进程和持久化边界"],
      ["sequences", "执行时序", "从触发源追到最终现象"],
      ["evidence", "证据边界", "已验证、源码可证和待复验"],
      ["review", "快速复习", "记忆卡、问题和项目口述"]
    ];

    const modules = [
      {
        id: "bsp", group: "01", title: "BSP 与启动部署", status: "verified", statusText: "已验证",
        summary: "TFTP 加载 Image/DTB，Linux 挂载 Buildroot NFS rootfs，并保留 eMMC 回退。",
        ownership: "负责构建、版本一致性、部署和启动证据；不负责业务采集规则。",
        files: ["dts_patches/rk3568-safety-terminal.dts", "dts_patches/rk3568-safety-terminal.dtsi", "scripts/sync_project_dts_to_sdk.sh", "scripts/build_project_dtb.sh"],
        functions: ["Kbuild: rockchip/rk3568-safety-terminal.dtb", "U-Boot: tftpboot / booti", "Linux: of_platform populate"],
        inputs: ["项目 DTS/DTSI", "SDK kernel tree", "Buildroot 工具链"],
        outputs: ["Image", "DTB", "ARM64 .ko / ELF", "运行内核与 NFS 根"],
        boundary: "项目基于现有 Rockchip BSP；没有从零实现 BootROM、U-Boot 或 Linux。",
        document: "02-Linux启动与构建部署.md"
      },
      {
        id: "driver", group: "02", title: "设备树与 safety_event 驱动", status: "verified", statusText: "已验证",

    function splitSvgText(value, maxLength = 18, maxLines = 2) {
      const text = String(value || "");
      const lines = [];
      let rest = text;
      while (rest.length && lines.length < maxLines) {
        if (rest.length <= maxLength) { lines.push(rest); rest = ""; break; }
        let cut = rest.lastIndexOf(" ", maxLength);
        if (cut < Math.floor(maxLength * .55)) cut = maxLength;
        lines.push(rest.slice(0, cut));
        rest = rest.slice(cut).trim();
      }
      if (rest && lines.length) lines[lines.length - 1] = `${lines[lines.length - 1].slice(0, Math.max(1, maxLength - 1))}…`;
      return lines;
    }

    function svgTspans(lines, x, firstY, className, lineHeight = 15) {

    }

        const width = Math.max(1100, scene.sequence.actors.length * 190 + 100);
        return {x: 0, y: 0, w: width, h: Math.max(620, scene.sequence.messages.length * 68 + 190)};
      }
      const maxX = Math.max(...scene.nodes.map(node => node.x + node.w)) + 70;
      const maxY = Math.max(...scene.nodes.map(node => node.y + node.h)) + 70;
      return {x: 0, y: 0, w: Math.max(1180, maxX), h: Math.max(650, maxY)};
    }

    function markerDefs() {
      return `<defs>
        <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#738388"/></marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3f38"/></marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6484"/></marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b54"/></marker>
        <marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c08016"/></marker>
      </defs>`;
    }

    function edgeGeometry(edge, nodeMap) {
      const from = nodeMap.get(edge.from);
      const to = nodeMap.get(edge.to);
      const fromCenter = {x: from.x + from.w / 2, y: from.y + from.h / 2};
      const toCenter = {x: to.x + to.w / 2, y: to.y + to.h / 2};
      const horizontal = Math.abs(toCenter.x - fromCenter.x) >= Math.abs(toCenter.y - fromCenter.y) * .55;
      let sx, sy, ex, ey;
      if (horizontal) {
        const forward = toCenter.x >= fromCenter.x;
        sx = forward ? from.x + from.w : from.x;
        ex = forward ? to.x : to.x + to.w;
        sy = fromCenter.y;
        ey = toCenter.y;
      } else {
        const downward = toCenter.y >= fromCenter.y;
        sx = fromCenter.x;
        ex = toCenter.x;
        sy = downward ? from.y + from.h : from.y;
        ey = downward ? to.y : to.y + to.h;
      }
      let path;
      let p1;
      let p2;
      if (horizontal) {
        const bend = Math.max(55, Math.abs(ex - sx) * .46);
        const sign = ex >= sx ? 1 : -1;
        p1 = {x: sx + bend * sign, y: sy};
        p2 = {x: ex - bend * sign, y: ey};
        path = `M ${sx} ${sy} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${ex} ${ey}`;
      } else {
        const bend = Math.max(45, Math.abs(ey - sy) * .46);
        const sign = ey >= sy ? 1 : -1;
        p1 = {x: sx, y: sy + bend * sign};
        p2 = {x: ex, y: ey - bend * sign};
        path = `M ${sx} ${sy} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${ex} ${ey}`;
      }
      return {path, p0: {x: sx, y: sy}, p1, p2, p3: {x: ex, y: ey}};
    }

    function cubicPoint(geometry, t) {
      const mt = 1 - t;
      return {
        x: mt ** 3 * geometry.p0.x + 3 * mt ** 2 * t * geometry.p1.x + 3 * mt * t ** 2 * geometry.p2.x + t ** 3 * geometry.p3.x,
        y: mt ** 3 * geometry.p0.y + 3 * mt ** 2 * t * geometry.p1.y + 3 * mt * t ** 2 * geometry.p2.y + t ** 3 * geometry.p3.y
      };
    }

    function cubicTangent(geometry, t) {
      const mt = 1 - t;
      return {
        x: 3 * mt ** 2 * (geometry.p1.x - geometry.p0.x) + 6 * mt * t * (geometry.p2.x - geometry.p1.x) + 3 * t ** 2 * (geometry.p3.x - geometry.p2.x),
        y: 3 * mt ** 2 * (geometry.p1.y - geometry.p0.y) + 6 * mt * t * (geometry.p2.y - geometry.p1.y) + 3 * t ** 2 * (geometry.p3.y - geometry.p2.y)
      };
    }

    function overlapArea(a, b, padding = 0) {
      const width = Math.min(a.x + a.w + padding, b.x + b.w + padding) - Math.max(a.x - padding, b.x - padding);
      const height = Math.min(a.y + a.h + padding, b.y + b.h + padding) - Math.max(a.y - padding, b.y - padding);
      return width > 0 && height > 0 ? width * height : 0;
    }

    function placeEdgeLabel(geometry, width, height, nodeBoxes, usedBoxes, bounds) {
      const positions = [.5, .34, .66, .22, .78, .42, .58, .12, .88];
      const offsets = [0, -28, 28, -56, 56, -84, 84, -112, 112, -140, 140];
      const tangentOffsets = [0, -36, 36, -72, 72];
      let best = null;
      for (const t of positions) {
        const point = cubicPoint(geometry, t);
        const tangent = cubicTangent(geometry, t);
        const length = Math.hypot(tangent.x, tangent.y) || 1;
        const normal = {x: -tangent.y / length, y: tangent.x / length};
        const direction = {x: tangent.x / length, y: tangent.y / length};
        for (const offset of offsets) {
          for (const tangentOffset of tangentOffsets) {
            const center = {x: point.x + normal.x * offset + direction.x * tangentOffset, y: point.y + normal.y * offset + direction.y * tangentOffset};
            const box = {x: center.x - width / 2, y: center.y - height / 2, w: width, h: height};
            let score = 0;
            nodeBoxes.forEach(nodeBox => { score += overlapArea(box, nodeBox, 7) * 8; });
            usedBoxes.forEach(labelBox => { score += overlapArea(box, labelBox, 5) * 12; });
            if (box.x < bounds.x + 5 || box.y < bounds.y + 5 || box.x + box.w > bounds.x + bounds.w - 5 || box.y + box.h > bounds.y + bounds.h - 5) score += 100000;
            score += Math.abs(offset) * .4 + Math.abs(tangentOffset) * .3 + Math.abs(t - .5) * 40;
            if (!best || score < best.score) best = {x: center.x, y: center.y, box, score};
            if (score === 0) return best;
          }
        }
      }
      return best;
    }

    function flowSvg(scene) {
      const nodeMap = new Map(scene.nodes.map(node => [node.id, node]));
      const selectedNode = diagramSelection?.kind === "node" ? diagramSelection.id : "";
      const selectedEdge = diagramSelection?.kind === "edge" ? diagramSelection.id : "";
      const relatedEdges = new Set(selectedNode ? scene.edges.filter(edge => edge.from === selectedNode || edge.to === selectedNode).map(edge => edge.id) : []);
      const relatedNodes = new Set([selectedNode]);
      scene.edges.forEach(edge => {
        if (relatedEdges.has(edge.id)) { relatedNodes.add(edge.from); relatedNodes.add(edge.to); }
      });
      const query = diagramSearch.trim().toLowerCase();
      const nodeBoxes = scene.nodes.map(node => ({x: node.x, y: node.y, w: node.w, h: node.h}));
      const usedLabelBoxes = [];
      const bounds = diagramBounds(scene, "flow");
      const edges = scene.edges.map((edge, index) => {
        const geometry = edgeGeometry(edge, nodeMap);
        const filtered = diagramFilter !== "all" && edge.type !== diagramFilter;
        const focused = edge.id === selectedEdge || relatedEdges.has(edge.id);
        const dimmed = filtered || (!!diagramSelection && !focused && !(selectedEdge && edge.id === selectedEdge));
        const traceDone = diagramTraceStep >= 0 && index <= diagramTraceStep;
        const label = splitSvgText(edge.label, 22, 1)[0];
        const labelWidth = Math.min(202, Math.max(58, label.length * 11 + 18));
        const placement = placeEdgeLabel(geometry, labelWidth, 24, nodeBoxes, usedLabelBoxes, bounds);
        usedLabelBoxes.push(placement.box);
        return `<g class="diagram-edge ${esc(edge.type)} ${edge.id === selectedEdge ? "selected" : ""} ${focused ? "related" : ""} ${dimmed ? "dimmed" : ""} ${filtered ? "filtered" : ""} ${traceDone ? "trace-done" : ""}" data-edge="${esc(edge.id)}">
          <title>${esc(`${edge.label}｜${edge.data}｜${edge.mode}`)}</title>
          <path class="edge-line" d="${geometry.path}"/><path class="edge-hit" d="${geometry.path}"/>
          <rect class="edge-label-bg" x="${placement.x - labelWidth / 2}" y="${placement.y - 12}" width="${labelWidth}" height="24" rx="4"/>
          <text class="edge-label" x="${placement.x}" y="${placement.y + 4}">${esc(label)}</text>
        </g>`;
      }).join("");
      const nodes = scene.nodes.map(node => {
        const selected = node.id === selectedNode;
        const related = relatedNodes.has(node.id);
        const dimmed = !!diagramSelection && !related && !selectedEdge;
        const searchText = `${node.label} ${node.role} ${node.fn} ${node.source}`.toLowerCase();
        const searchHit = query && searchText.includes(query);
        const titleLines = splitSvgText(node.label, 17, 2);
        let supplemental = "";
        if (diagramDensity === "standard") supplemental = splitSvgText(node.role, 23, 1)[0] || "";
        if (diagramDensity === "source") supplemental = splitSvgText(node.fn, 23, 1)[0] || "";
        const titleY = node.y + (supplemental ? 25 : 31) - (titleLines.length - 1) * 6;
        const traceDone = diagramTraceStep >= 0 && scene.edges.slice(0, diagramTraceStep + 1).some(edge => edge.from === node.id || edge.to === node.id);
        return `<g class="diagram-node ${esc(node.kind)} ${selected ? "selected" : ""} ${related && !selected ? "related" : ""} ${dimmed ? "dimmed" : ""} ${searchHit ? "search-hit" : ""} ${traceDone ? "trace-done" : ""}" data-node="${esc(node.id)}" tabindex="0">
          <rect x="${node.x}" y="${node.y}" width="${node.w}" height="${node.h}"/>
          ${svgTspans(titleLines, node.x + node.w / 2, titleY, "node-title", 15)}
          ${supplemental ? `<text class="node-sub" x="${node.x + node.w / 2}" y="${node.y + node.h - 12}">${esc(supplemental)}</text>` : ""}
        </g>`;
      }).join("");
      return `${markerDefs()}${edges}${nodes}`;
    }

    function sequenceSvg(scene) {
      const actors = scene.sequence.actors;
      const messages = scene.sequence.messages;
      const actorX = new Map(actors.map((actor, index) => [actor[0], 100 + index * 190]));
      const bottom = Math.max(560, messages.length * 68 + 145);
      const actorMarkup = actors.map(actor => {
        const x = actorX.get(actor[0]);
        return `<g class="sequence-actor"><rect x="${x - 72}" y="28" width="144" height="48"/><text x="${x}" y="57">${esc(actor[1])}</text><line class="sequence-life" x1="${x}" y1="76" x2="${x}" y2="${bottom}"/></g>`;
      }).join("");
      const messageMarkup = messages.map((message, index) => {
        const fromX = actorX.get(message.from);
        const toX = actorX.get(message.to);
        const y = 125 + index * 68;
        const selected = diagramSelection?.kind === "message" && diagramSelection.id === String(index);
        const dimmed = diagramSelection?.kind === "message" && !selected;
        const traceDone = diagramTraceStep >= 0 && index <= diagramTraceStep;
        const label = splitSvgText(message.label, 30, 1)[0];
        const labelWidth = Math.min(260, Math.max(78, label.length * 11 + 18));
        let arrow;
        let labelX;
        if (fromX === toX) {
          arrow = `<path d="M ${fromX} ${y} h 70 v 30 h -68"/>`;
          labelX = fromX + 38;
        } else {
          arrow = `<line x1="${fromX}" y1="${y}" x2="${toX}" y2="${y}"/>`;
          labelX = (fromX + toX) / 2;
        }
        return `<g class="sequence-message ${message.type === "async" ? "async" : ""} ${selected ? "selected" : ""} ${dimmed ? "dimmed" : ""} ${traceDone ? "trace-done" : ""}" data-message="${index}">
          <title>${esc(`${message.label}｜${message.detail}`)}</title>${arrow}<rect class="sequence-label-bg" x="${labelX - labelWidth / 2}" y="${y - 28}" width="${labelWidth}" height="22" rx="4"/><circle class="step-circle" cx="${Math.min(fromX, toX) - 14}" cy="${y}" r="10"/><text class="step-number" x="${Math.min(fromX, toX) - 14}" y="${y + 3}">${index + 1}</text><text x="${labelX}" y="${y - 12}">${esc(label)}</text>
        </g>`;
      }).join("");
      return `${markerDefs()}${actorMarkup}${messageMarkup}`;
    }

    function renderDiagramInspector(scene) {
      if (!diagramSelection) {
        return `<h4>${esc(scene.title)}</h4><p>${esc(scene.summary)}</p><div class="inspector-list"><div class="inspector-row"><strong>看图结论</strong>${esc(scene.conclusion)}</div><div class="inspector-row"><strong>事实边界</strong>连线表示真实接口、数据依赖或启动关系；只有标明函数调用的连线才代表直接调用。</div></div>`;
      }
      if (diagramSelection.kind === "node") {
        const node = scene.nodes.find(item => item.id === diagramSelection.id);
        if (!node) return "";
        const incoming = scene.edges.filter(edge => edge.to === node.id);
        const outgoing = scene.edges.filter(edge => edge.from === node.id);
        return `<span class="eyebrow">节点 / ${esc(node.kind)}</span><h4>${esc(node.label)}</h4><p>${esc(node.role)}</p>
          <div class="inspector-list">
            <div class="inspector-row"><strong>关键函数或接口</strong><code>${esc(node.fn)}</code></div>
            <div class="inspector-row"><strong>源码依据</strong><code>${esc(node.source)}</code></div>
            <div class="inspector-row"><strong>上游输入</strong>${incoming.length ? incoming.map(edge => `${esc(edge.label)} ← ${esc(scene.nodes.find(nodeItem => nodeItem.id === edge.from)?.label || edge.from)}`).join("<br>") : "无图内上游"}</div>
            <div class="inspector-row"><strong>下游输出</strong>${outgoing.length ? outgoing.map(edge => `${esc(edge.label)} → ${esc(scene.nodes.find(nodeItem => nodeItem.id === edge.to)?.label || edge.to)}`).join("<br>") : "无图内下游"}</div>
            ${node.drill ? `<div class="inspector-row"><strong>可下钻场景</strong>${esc(diagramScenes.find(item => item.id === node.drill)?.title || node.drill)}</div>` : ""}
            ${node.module ? `<div class="inspector-row"><strong>模块索引</strong>${esc(modules.find(item => item.id === node.module)?.title || node.module)}</div>` : ""}
          </div>`;
      }
      if (diagramSelection.kind === "edge") {
        const edge = scene.edges.find(item => item.id === diagramSelection.id);
        if (!edge) return "";
        const from = scene.nodes.find(node => node.id === edge.from);
        const to = scene.nodes.find(node => node.id === edge.to);
        return `<span class="eyebrow">接口关系 / ${esc(edge.type)}</span><h4>${esc(edge.label)}</h4><p>${esc(from?.label || edge.from)} → ${esc(to?.label || edge.to)}</p>
          <div class="inspector-list">
            <div class="inspector-row"><strong>传递内容</strong>${esc(edge.data)}</div>
            <div class="inspector-row"><strong>触发条件</strong>${esc(edge.trigger)}</div>
            <div class="inspector-row"><strong>执行方式</strong>${esc(edge.mode)}</div>
            <div class="inspector-row"><strong>源码依据</strong><code>${esc(edge.source)}</code></div>
            <div class="inspector-row"><strong>证据等级</strong>${evidenceBadge(edge.evidence)}</div>
          </div>`;
      }
      const message = scene.sequence.messages[Number(diagramSelection.id)];
      const actorMap = new Map(scene.sequence.actors);
      return `<span class="eyebrow">时序消息 / 第 ${Number(diagramSelection.id) + 1} 步</span><h4>${esc(message.label)}</h4><p>${esc(actorMap.get(message.from))} → ${esc(actorMap.get(message.to))}</p>
        <div class="inspector-list"><div class="inspector-row"><strong>本步含义</strong>${esc(message.detail)}</div><div class="inspector-row"><strong>源码依据</strong><code>${esc(message.source)}</code></div><div class="inspector-row"><strong>执行方式</strong>${message.type === "async" ? "异步事件或周期动作" : "同步调用或请求"}</div><div class="inspector-row"><strong>证据等级</strong>${evidenceBadge(message.evidence)}</div></div>`;
    }

    function renderDiagrams() {
      const scene = diagramScenes.find(item => item.id === activeDiagram) || diagramScenes[0];
      const key = `${scene.id}:${diagramMode}`;
      if (!diagramViewBoxes.has(key)) diagramViewBoxes.set(key, diagramBounds(scene, diagramMode));
      const viewBox = diagramViewBoxes.get(key);
      const traceLength = diagramMode === "flow" ? scene.edges.length : scene.sequence.messages.length;
      document.getElementById("diagrams").innerHTML = `
        <div class="section-head"><div><h3>源码级全链路关系图</h3><p>${esc(scene.summary)}</p></div></div>
        <div class="diagram-shell">
          <div class="diagram-toolbar">
            <select id="diagram-scene" aria-label="链路场景">${diagramScenes.map(item => `<option value="${item.id}" ${item.id === scene.id ? "selected" : ""}>${esc(item.title)}</option>`).join("")}</select>
            <div class="tool-group" aria-label="图表视角"><button data-mode="flow" class="${diagramMode === "flow" ? "active" : ""}">流程</button><button data-mode="sequence" class="${diagramMode === "sequence" ? "active" : ""}">时序</button></div>
            <div class="tool-group" aria-label="信息密度"><button data-density="review" class="${diagramDensity === "review" ? "active" : ""}">复习</button><button data-density="standard" class="${diagramDensity === "standard" ? "active" : ""}">标准</button><button data-density="source" class="${diagramDensity === "source" ? "active" : ""}">源码</button></div>
            <select id="diagram-filter" aria-label="关系筛选" ${diagramMode === "sequence" ? "disabled" : ""}><option value="all">全部关系</option><option value="boot">启动/配置</option><option value="async">异步事件</option><option value="ipc">进程间通信</option><option value="data">状态数据</option><option value="hardware">告警控制</option><option value="media">AI/视频</option></select>
            <div class="toolbar-spacer"></div>
            <div class="tool-group" aria-label="链路追踪"><button data-action="trace-prev" title="上一步" ${diagramTraceStep < 0 ? "disabled" : ""}>←</button><button data-action="trace-next" title="下一步" ${diagramTraceStep >= traceLength - 1 ? "disabled" : ""}>→</button><button data-action="trace-reset" title="回到开始">起点</button></div>
            <div class="tool-group" aria-label="画布显示"><button data-action="toggle-inspector" class="${diagramExpanded ? "" : "active"}" title="显示或隐藏详情栏">详情栏</button><button data-action="zoom-out" title="缩小">−</button><button data-action="zoom-in" title="放大">＋</button><button data-action="fit" title="适配画布">适配</button><button data-action="reset" title="重置图表">重置</button></div>
          </div>
          <div class="diagram-stage ${diagramExpanded ? "expanded" : ""}">
            <div id="diagram-viewport" class="diagram-viewport">
              <svg id="diagram-svg" class="diagram-svg" viewBox="${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(scene.title)}">
                ${diagramMode === "flow" ? flowSvg(scene) : sequenceSvg(scene)}
              </svg>
            </div>
            <aside class="diagram-inspector">${renderDiagramInspector(scene)}</aside>
          </div>
          <div class="diagram-caption"><strong>看图结论：</strong>${esc(scene.conclusion)}
            <div class="diagram-legend"><span><i class="legend-line"></i>直接调用/请求</span><span><i class="legend-line async"></i>异步事件</span><span><i class="legend-line alarm"></i>硬件告警</span><span><i class="legend-line media"></i>AI/视频</span><span><i class="legend-line data"></i>状态数据</span></div>
          </div>
        </div>`;
      const filter = document.getElementById("diagram-filter");
      if (filter) filter.value = diagramFilter;
      bindDiagramEvents(scene);
    }

    function bindDiagramEvents(scene) {
      document.getElementById("diagram-scene").addEventListener("change", event => {
        activeDiagram = event.target.value;
        diagramSelection = null;
        diagramTraceStep = -1;
        diagramFilter = "all";
        diagramExpanded = true;
        renderDiagrams();
      });
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
        diagramMode = button.dataset.mode;
        diagramSelection = null;
        diagramTraceStep = -1;
        diagramExpanded = true;
        renderDiagrams();
      }));
      document.querySelectorAll("[data-density]").forEach(button => button.addEventListener("click", () => {
        diagramDensity = button.dataset.density;
        renderDiagrams();
      }));
      const filter = document.getElementById("diagram-filter");
      if (filter) filter.addEventListener("change", event => { diagramFilter = event.target.value; diagramSelection = null; renderDiagrams(); });
      document.querySelectorAll("[data-node]").forEach(nodeElement => {
        const select = () => { diagramSelection = {kind: "node", id: nodeElement.dataset.node}; diagramExpanded = false; renderDiagrams(); };
        nodeElement.addEventListener("click", event => { event.stopPropagation(); select(); });
        nodeElement.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") select(); });
        nodeElement.addEventListener("dblclick", event => {
          event.stopPropagation();
          const node = scene.nodes.find(item => item.id === nodeElement.dataset.node);
          if (node?.drill && diagramScenes.some(item => item.id === node.drill)) {
            activeDiagram = node.drill;
            diagramSelection = null;
            diagramTraceStep = -1;
            diagramFilter = "all";
            diagramExpanded = true;
            renderDiagrams();
          } else if (node?.module) {
            activeModule = node.module;
            showView("modules");
          }
        });
      });
      document.querySelectorAll("[data-edge]").forEach(edgeElement => edgeElement.addEventListener("click", event => {
        event.stopPropagation();
        diagramSelection = {kind: "edge", id: edgeElement.dataset.edge};
        diagramExpanded = false;
        renderDiagrams();
      }));
      document.querySelectorAll("[data-message]").forEach(messageElement => messageElement.addEventListener("click", event => {
        event.stopPropagation();
        diagramSelection = {kind: "message", id: messageElement.dataset.message};
        diagramTraceStep = Number(messageElement.dataset.message);
        diagramExpanded = false;
        renderDiagrams();
      }));
      document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => handleDiagramAction(button.dataset.action, scene)));
      bindDiagramPanZoom(scene);
    }

    function handleDiagramAction(action, scene) {
      const key = `${scene.id}:${diagramMode}`;
      const limit = (diagramMode === "flow" ? scene.edges.length : scene.sequence.messages.length) - 1;
      if (action === "trace-prev") diagramTraceStep = Math.max(-1, diagramTraceStep - 1);
      if (action === "trace-next") diagramTraceStep = Math.min(limit, diagramTraceStep + 1);
      if (action === "trace-reset") { diagramTraceStep = -1; diagramSelection = null; }
      if (action === "toggle-inspector") diagramExpanded = !diagramExpanded;
      if (action === "fit") diagramViewBoxes.set(key, diagramBounds(scene, diagramMode));
      if (action === "reset") {
        diagramViewBoxes.set(key, diagramBounds(scene, diagramMode));
        diagramSelection = null;
        diagramTraceStep = -1;
        diagramFilter = "all";
        diagramSearch = "";
        diagramExpanded = true;
        search.value = "";
      }
      if (action === "zoom-in" || action === "zoom-out") {
        const current = diagramViewBoxes.get(key);
        const factor = action === "zoom-in" ? .82 : 1.22;
        const nextW = Math.max(260, Math.min(current.w * factor, diagramBounds(scene, diagramMode).w * 2.5));
        const nextH = Math.max(180, Math.min(current.h * factor, diagramBounds(scene, diagramMode).h * 2.5));
        diagramViewBoxes.set(key, {x: current.x + (current.w - nextW) / 2, y: current.y + (current.h - nextH) / 2, w: nextW, h: nextH});
      }
      renderDiagrams();
    }

    function bindDiagramPanZoom(scene) {
      const viewport = document.getElementById("diagram-viewport");
      const svg = document.getElementById("diagram-svg");
      const key = `${scene.id}:${diagramMode}`;
      let drag = null;
      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest("[data-node],[data-edge],[data-message]")) return;
        const current = diagramViewBoxes.get(key);
        drag = {x: event.clientX, y: event.clientY, viewX: current.x, viewY: current.y};
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", event => {
        if (!drag) return;
        const current = diagramViewBoxes.get(key);
        const rect = viewport.getBoundingClientRect();
        current.x = drag.viewX - (event.clientX - drag.x) * current.w / rect.width;
        current.y = drag.viewY - (event.clientY - drag.y) * current.h / rect.height;
        svg.setAttribute("viewBox", `${current.x} ${current.y} ${current.w} ${current.h}`);
      });
      const endDrag = () => { drag = null; viewport.classList.remove("dragging"); };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      viewport.addEventListener("click", event => {
        if (event.target === svg) { diagramSelection = null; renderDiagrams(); }
      });
      viewport.addEventListener("wheel", event => {
        event.preventDefault();
        const current = diagramViewBoxes.get(key);
        const rect = viewport.getBoundingClientRect();
        const pointX = current.x + (event.clientX - rect.left) / rect.width * current.w;
        const pointY = current.y + (event.clientY - rect.top) / rect.height * current.h;
        const factor = event.deltaY < 0 ? .88 : 1.14;
        const base = diagramBounds(scene, diagramMode);
        const nextW = Math.max(260, Math.min(current.w * factor, base.w * 2.5));
        const nextH = Math.max(180, Math.min(current.h * factor, base.h * 2.5));
        const ratioX = (pointX - current.x) / current.w;
        const ratioY = (pointY - current.y) / current.h;
        current.x = pointX - ratioX * nextW;
        current.y = pointY - ratioY * nextH;
        current.w = nextW;
        current.h = nextH;
        svg.setAttribute("viewBox", `${current.x} ${current.y} ${current.w} ${current.h}`);
      }, {passive: false});
    }

    function renderSequences() {
      const scenario = scenarios.find(item => item.id === activeScenario);
      document.getElementById("sequences").innerHTML = `
        <div class="section-head"><div><h3>端到端执行时序</h3><p>选择一个真实场景，从触发源追到最终用户现象。</p></div></div>
        <div class="scenario-tabs">${scenarios.map(item => `<button data-scenario="${item.id}" class="${item.id === activeScenario ? "active" : ""}">${esc(item.title)}</button>`).join("")}</div>
        <div class="timeline">${scenario.steps.map(step => `<div class="timeline-item"><strong>${esc(step[0])}</strong><p>${esc(step[1])}</p></div>`).join("")}</div>
        <div class="call-chain">${esc(scenario.chain)}</div>`;
      document.querySelectorAll("[data-scenario]").forEach(button => button.addEventListener("click", () => { activeScenario = button.dataset.scenario; renderSequences(); }));
    }

    function renderEvidence() {
      document.getElementById("evidence").innerHTML = `
        <div class="section-head"><div><h3>功能与证据边界</h3><p>避免把源码、构建、部署和板端验收混成同一个结论。</p></div></div>
        <div class="evidence-grid">${evidence.map(item => `<article class="evidence-row">${badge(item[1], item[1] === "verified" ? "已验证" : item[1] === "pending" ? "待复验" : "未实现")}<h4>${esc(item[0])}</h4><p>${esc(item[2])}</p></article>`).join("")}</div>
        <div class="band" style="margin-top:16px"><h4>统一判断式</h4><p>源码存在 ≠ 编译成功 ≠ 部署成功 ≠ 板端运行 ≠ 异常场景验证。简历和面试只使用当前证据能支持的最窄结论。</p></div>`;
    }

    function renderReview() {
      document.getElementById("review").innerHTML = `
        <div class="section-head"><div><h3>五分钟复习卡</h3><p>先背主线，再回答问题，最后练习一分钟口述。</p></div></div>
        <div class="review-grid">
          <section class="review-block"><h4>十个核心词</h4><ol><li>项目 DTS/DTSI</li><li>safety_event_probe</li><li>threaded IRQ</li><li>delayed_work</li><li>wait queue + poll/read</li><li>SET_USER_ALARM ioctl</li><li>CaptureWorker + RKNN + ROI</li><li>system_state.json</li><li>SQLite event_id + MQTT 游标</li><li>RuntimeModel + HistoryModel + H264VideoBridge</li></ol></section>
          <section class="review-block"><h4>十个自测问题</h4><ol>${reviewQuestions.map(item => `<li>${esc(item)}</li>`).join("")}</ol></section>
          <section class="review-block" style="grid-column:1/-1"><h4>一分钟口述</h4><p style="margin:0;line-height:1.9;font-size:13px">我在 RK3568 和 Buildroot Linux 上实现了一个端侧工业安全辅助监测终端。BSP 侧建立 TFTP Image/DTB、NFS rootfs 与 eMMC 回退链；驱动侧实现 safety_event platform 字符设备，接入门磁 IRQ、BH1750、LED 和 PWM，提供 wait queue、poll/read/ioctl。用户态通过 hwmon、TTY 和 USB UVC 接入温湿度、毫米波雷达与摄像头，使用 RGA、RKNN 和固定 ROI 完成人员危险区检测，并把多源告警合并到本地声光输出。系统还提供统一 JSON 状态、SQLite 历史、MQTT 上报源码以及 Qt/QML HMI。我会明确区分已经板端验证、只有源码证据和仍需复验的功能。</p></section>
        </div>`;
    }

    search.addEventListener("input", event => {
      if (activeView === "modules") renderModules(event.target.value);
      else if (activeView === "interfaces") renderInterfaces(event.target.value);
      else if (activeView === "diagrams") { diagramSearch = event.target.value; renderDiagrams(); }
      else if (event.target.value.trim()) showView("modules");
    });
    mobileNav.addEventListener("change", event => showView(event.target.value));

    renderNavigation();
    renderOverview();
    renderDiagrams();
    renderModules("");
    renderInterfaces("");
    renderSequences();
    renderEvidence();
    renderReview();
  </script>
</body>
